upstream users_ms {
    server users:8000;
}

upstream spaces_ms {
    server spaces:8000;
}

upstream reservations_ms {
    server reservations:8000;
}

server {
    listen 80;
    server_name localhost;

    # ── Health check del propio gateway ──────────────────────────────────
    location = /api/gateway/health {
        access_log off;
        return 200 '{"status":"ok","service":"api-gateway"}';
        add_header Content-Type application/json;
    }

    # ── Health checks de los microservicios ──────────────────────────────
    location = /api/health/users {
        proxy_pass http://users_ms/api/health/;
        include /etc/nginx/proxy_params;
    }

    location = /api/health/spaces {
        proxy_pass http://spaces_ms/api/health/;
        include /etc/nginx/proxy_params;
    }

    # ── Users MS ─────────────────────────────────────────────────────────
    # Auth: /api/v1/auth/*
    location /api/v1/auth/ {
        proxy_pass http://users_ms;
        include /etc/nginx/proxy_params;
    }

    # Profile: /api/v1/users/me/
    location /api/v1/users/ {
        proxy_pass http://users_ms;
        include /etc/nginx/proxy_params;
    }

    # Admin users: /api/v1/admin/users/*
    location /api/v1/admin/users/ {
        proxy_pass http://users_ms;
        include /etc/nginx/proxy_params;
    }

    # ── Spaces MS ────────────────────────────────────────────────────────
    # Spaces: /api/v1/spaces/*
    location /api/v1/spaces/ {
        proxy_pass http://spaces_ms;
        include /etc/nginx/proxy_params;
    }

    # Areas: /api/v1/areas/*
    location /api/v1/areas/ {
        proxy_pass http://spaces_ms;
        include /etc/nginx/proxy_params;
    }

    # ── Reservations MS ──────────────────────────────────────────────────
    # Reservations: /api/v1/reservations/*
    location /api/v1/reservations/ {
        proxy_pass http://reservations_ms;
        include /etc/nginx/proxy_params;
    }

    # ── Catch-all: 404 para rutas no mapeadas ───────────────────────────
    location / {
        return 404 '{"error":"route not found","hint":"check /api/v1/..."}';
        add_header Content-Type application/json;
    }
}
