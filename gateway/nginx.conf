# Pool de conexiones keep-alive a cada microservicio
upstream users_ms {
    server users:8000;
    keepalive 16;
}

upstream spaces_ms {
    server spaces:8000;
    keepalive 16;
}

upstream reservations_ms {
    server reservations:8000;
    keepalive 16;
}

upstream notifications_ms {
    server notifications:8000;
    keepalive 16;
}

upstream reports_ms {
    server reports:8000;
    keepalive 16;
}

# Compresión global
gzip on;
gzip_vary on;
gzip_min_length 256;
gzip_proxied any;
gzip_types
  application/json
  application/javascript
  application/xml
  text/css
  text/plain
  text/xml;

server {
    listen 80;
    server_name localhost;

    # ── Health check del propio gateway ──────────────────────────────────
    location = /api/gateway/health {
        access_log off;
        return 200 '{"status":"ok","service":"api-gateway"}';
        add_header Content-Type application/json;
    }

    # ── Health checks de los microservicios ──────────────────────────────
    location = /api/health/users {
        proxy_pass http://users_ms/api/health/;
        include /etc/nginx/proxy_params;
    }

    location = /api/health/spaces {
        proxy_pass http://spaces_ms/api/health/;
        include /etc/nginx/proxy_params;
    }

    # ── Users MS ─────────────────────────────────────────────────────────
    # Auth: /api/v1/auth/*
    location /api/v1/auth/ {
        proxy_pass http://users_ms;
        include /etc/nginx/proxy_params;
    }

    # Profile: /api/v1/users/me/
    location /api/v1/users/ {
        proxy_pass http://users_ms;
        include /etc/nginx/proxy_params;
    }

    # Admin users: /api/v1/admin/users/*
    location /api/v1/admin/users/ {
        proxy_pass http://users_ms;
        include /etc/nginx/proxy_params;
    }

    # Admin rules: /api/v1/admin/rules/ (HU-26) → reservations
    location /api/v1/admin/rules/ {
        proxy_pass http://reservations_ms;
        include /etc/nginx/proxy_params;
    }

    # ── Spaces MS ────────────────────────────────────────────────────────
    # Spaces: /api/v1/spaces/*
    location /api/v1/spaces/ {
        proxy_pass http://spaces_ms;
        include /etc/nginx/proxy_params;
    }

    # Areas / Dependencias: /api/v1/areas/* — HU-1
    location /api/v1/areas/ {
        proxy_pass http://spaces_ms;
        include /etc/nginx/proxy_params;
    }

    # Holidays — HU-19
    location /api/v1/holidays/ {
        proxy_pass http://spaces_ms;
        include /etc/nginx/proxy_params;
    }

    # ── Reservations MS ──────────────────────────────────────────────────
    # Reservations: /api/v1/reservations/*
    location /api/v1/reservations/ {
        proxy_pass http://reservations_ms;
        include /etc/nginx/proxy_params;
    }

    # ── Notifications MS — HU-4, HU-14, HU-15 ────────────────────────────
    location /api/v1/notifications/ {
        proxy_pass http://notifications_ms;
        include /etc/nginx/proxy_params;
    }

    # ── Reports MS — HU-22, 23, 24, 25, 27 ───────────────────────────────
    location /api/v1/reports/ {
        proxy_pass http://reports_ms;
        include /etc/nginx/proxy_params;
    }

    location /api/v1/audit/ {
        proxy_pass http://reports_ms;
        include /etc/nginx/proxy_params;
    }

    # ── Catch-all: 404 para rutas no mapeadas ───────────────────────────
    location / {
        return 404 '{"error":"route not found","hint":"check /api/v1/..."}';
        add_header Content-Type application/json;
    }
}
