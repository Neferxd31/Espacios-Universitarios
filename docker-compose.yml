services:
  # ── API Gateway (Nginx) ──────────────────────────────────────────────────
  gateway:
    build:
      context: ./gateway
    ports:
      - "8000:80"
    depends_on:
      - users
      - spaces
      - reservations
    networks:
      - classrooms

  # ── Microservicios ───────────────────────────────────────────────────────
  users:
    build:
      context: ./microservices/users
    expose:
      - "8000"
    environment:
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,users,gateway
      DATABASE_URL: ${USERS_DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-jwt-secret-change-in-production}
      JWT_ACCESS_TOKEN_EXPIRE_HOURS: ${JWT_ACCESS_TOKEN_EXPIRE_HOURS:-1}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
    networks:
      - classrooms

  spaces:
    build:
      context: ./microservices/spaces
    expose:
      - "8000"
    environment:
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,spaces,gateway
      DATABASE_URL: ${SPACES_DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-jwt-secret-change-in-production}
    networks:
      - classrooms

  reservations:
    build:
      context: ./microservices/reservations
    expose:
      - "8000"
    environment:
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,reservations,gateway
      DATABASE_URL: ${RESERVATIONS_DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-jwt-secret-change-in-production}
      USERS_SERVICE_URL: http://users:8000
      SPACES_SERVICE_URL: http://spaces:8000
    depends_on:
      - users   
      - spaces
    networks:
      - classrooms

  # ── Frontend (Next.js) ───────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend/frontend
      args:
        # Ahora todo pasa por el gateway en un solo puerto
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - gateway
    networks:
      - classrooms

networks:
  classrooms:
    driver: bridge
