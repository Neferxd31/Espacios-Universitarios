services:
  # ── Message Broker (RabbitMQ) ─────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"    # AMQP — consumido por los microservicios
      - "15672:15672"  # Management UI → http://localhost:15672 (guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    networks:
      - classrooms
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API Gateway (Nginx) ──────────────────────────────────────────────────
  gateway:
    build:
      context: ./gateway
    ports:
      - "8000:80"
    depends_on:
      - users
      - spaces
      - reservations
    networks:
      - classrooms

  # ── Microservicios ───────────────────────────────────────────────────────
  users:
    build:
      context: ./microservices/users
    expose:
      - "8000"
    environment:
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,users,gateway
      DATABASE_URL: ${USERS_DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-jwt-secret-change-in-production}
      JWT_ACCESS_TOKEN_EXPIRE_HOURS: ${JWT_ACCESS_TOKEN_EXPIRE_HOURS:-1}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
    networks:
      - classrooms

  spaces:
    build:
      context: ./microservices/spaces
    expose:
      - "8000"
    environment:
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,spaces,gateway
      DATABASE_URL: ${SPACES_DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-jwt-secret-change-in-production}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
    depends_on:
      - rabbitmq
    networks:
      - classrooms

  reservations:
    build:
      context: ./microservices/reservations
    expose:
      - "8000"
    environment:
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,reservations,gateway
      DATABASE_URL: ${RESERVATIONS_DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-jwt-secret-change-in-production}
      USERS_SERVICE_URL: http://users:8000
      SPACES_SERVICE_URL: http://spaces:8000
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
    depends_on:
      - users
      - spaces
      - rabbitmq
    networks:
      - classrooms

  # ── Frontend (Next.js) ───────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend/frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - gateway
    networks:
      - classrooms

networks:
  classrooms:
    driver: bridge
