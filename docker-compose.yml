services:
  # ── Message Broker (RabbitMQ) ─────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"    # AMQP — consumido por los microservicios
      - "15672:15672"  # Management UI → http://localhost:15672 (guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    networks:
      - classrooms
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API Gateway (Nginx) ──────────────────────────────────────────────────
  gateway:
    build:
      context: ./gateway
    ports:
      - "8000:80"
    depends_on:
      - users
      - spaces
      - reservations
      - notifications
      - reports
    networks:
      - classrooms

  # ── Microservicios ───────────────────────────────────────────────────────
  users:
    build:
      context: ./microservices/users
    expose:
      - "8000"
    environment:
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,users,gateway
      DATABASE_URL: ${USERS_DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-jwt-secret-change-in-production}
      JWT_ACCESS_TOKEN_EXPIRE_HOURS: ${JWT_ACCESS_TOKEN_EXPIRE_HOURS:-1}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      - rabbitmq
    networks:
      - classrooms

  spaces:
    build:
      context: ./microservices/spaces
    expose:
      - "8000"
    environment:
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,spaces,gateway
      DATABASE_URL: ${SPACES_DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-jwt-secret-change-in-production}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
    depends_on:
      - rabbitmq
    networks:
      - classrooms

  reservations:
    build:
      context: ./microservices/reservations
    expose:
      - "8000"
    environment:
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,reservations,gateway
      DATABASE_URL: ${RESERVATIONS_DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-jwt-secret-change-in-production}
      USERS_SERVICE_URL: http://users:8000
      SPACES_SERVICE_URL: http://spaces:8000
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
    depends_on:
      - users
      - spaces
      - rabbitmq
    networks:
      - classrooms

  # ── Notifications microservice ───────────────────────────────────────────
  notifications:
    build:
      context: ./microservices/notifications
    expose:
      - "8000"
    ports:
      - "8083:8000"
    environment:
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,notifications,gateway
      DATABASE_URL: ${NOTIFICATIONS_DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-jwt-secret-change-in-production}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Espacios UFPS <no-reply@ufps.edu.co>}
      REMINDER_HOURS_BEFORE: ${REMINDER_HOURS_BEFORE:-1}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      - rabbitmq
    networks:
      - classrooms

  # ── Worker: cron de recordatorios (HU-15) ────────────────────────────────
  notifications-reminder-cron:
    build:
      context: ./microservices/notifications
    command: ["sh", "-c", "while true; do python manage.py send_due_reminders; sleep ${REMINDER_TICK_SECONDS:-300}; done"]
    environment:
      DATABASE_URL: ${NOTIFICATIONS_DATABASE_URL}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Espacios UFPS <no-reply@ufps.edu.co>}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      - notifications
    restart: unless-stopped
    networks:
      - classrooms

  # ── Worker: consumer RabbitMQ ────────────────────────────────────────────
  notifications-worker:
    build:
      context: ./microservices/notifications
    command: ["python", "manage.py", "consume_events"]
    environment:
      DATABASE_URL: ${NOTIFICATIONS_DATABASE_URL}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Espacios UFPS <no-reply@ufps.edu.co>}
      REMINDER_HOURS_BEFORE: ${REMINDER_HOURS_BEFORE:-1}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      - rabbitmq
      - notifications
    restart: unless-stopped
    networks:
      - classrooms

  # ── Reports microservice ─────────────────────────────────────────────────
  reports:
    build:
      context: ./microservices/reports
    expose:
      - "8000"
    ports:
      - "8084:8000"
    environment:
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,reports,gateway
      DATABASE_URL: ${REPORTS_DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-jwt-secret-change-in-production}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
    depends_on:
      - rabbitmq
    networks:
      - classrooms

  reports-worker:
    build:
      context: ./microservices/reports
    command: ["python", "manage.py", "consume_events"]
    environment:
      DATABASE_URL: ${REPORTS_DATABASE_URL}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
    depends_on:
      - rabbitmq
      - reports
    restart: unless-stopped
    networks:
      - classrooms

  # ── Frontend (Next.js) ───────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend/frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - gateway
    networks:
      - classrooms

networks:
  classrooms:
    driver: bridge
